# Module 12 Visualization Configuration
style:
  box_thickness: 2
  font_scale: 0.6
  font_thickness: 1
  text_padding: 5
  panel_alpha: 0.6

colors:
  # BGR format
  PASS: [0, 255, 0]      # Green
  REVIEW: [0, 255, 255]  # Yellow
  REJECT: [0, 0, 255]    # Red
  
  # Severity
  NONE: [0, 255, 0]
  LOW: [0, 200, 255]
  MEDIUM: [0, 165, 255]
  HIGH: [0, 100, 255]
  CRITICAL: [0, 0, 255]
  
  # Default mapping colors
  DEFAULT_BOX: [255, 255, 0]
  TEXT: [255, 255, 255]
  TEXT_BACKGROUND: [0, 0, 0]
